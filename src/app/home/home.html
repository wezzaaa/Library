<h1>Accueil bibliothèque</h1>
<p>Bienvenue sur l'application Library.</p>
<p>Découvre des livres, leurs auteurs, ajoute des favoris et prépare ta liste à lire.</p>

<p *ngIf="loading">Chargement...</p>

<div class="books-grid" *ngIf="!loading && books.length > 0">
  <app-book-card
    *ngFor="let book of books"
    [book]="book">
  </app-book-card>
</div>
